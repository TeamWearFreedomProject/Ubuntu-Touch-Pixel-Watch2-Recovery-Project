name: Ubuntu Touch recovery - preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check runner and upstream downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      # Google eos' deviceinfo uses "arm" (armhf userspace) and "aarch64" kernel.
      UBUNTU_ROOTFS_URL: https://ci.ubports.com/job/ubuntu-touch-rootfs/job/ubports%252Ffocal/lastSuccessfulBuild/artifact/ubuntu-touch-android9plus-rootfs-armhf.tar.gz
      HALIUM_13_URL: https://ci.ubports.com/job/UBportsCommunityPortsJenkinsCI/job/ubports%252Fporting%252Fcommunity-ports%252Fjenkins-ci%252Fgeneric_arm64/job/halium-13.0-arm32/lastSuccessfulBuild/artifact/halium_halium_arm.tar.xz
      DEVICEINFO_URL: https://gitlab.com/ubports/porting/community-ports/android13/google-eos/google-eos/-/raw/b9ff8948/deviceinfo

    steps:
      - name: Inspect temporary runner resources
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          df -h / /tmp "$GITHUB_WORKSPACE"
          free -h
          {
            echo "## Runner resources"
            echo ""
            df -h / /tmp "$GITHUB_WORKSPACE"
            free -h
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe source URLs without downloading image files
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          {
            echo "## Upstream availability (HTTP HEAD)"
            echo ""
            echo "| Source | HTTP | Content type |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          probe() {
            local label="$1" url="$2" result code type
            result="$(curl --silent --show-error --location --head \
              --retry 2 --connect-timeout 15 --max-time 60 \
              --output /dev/null --write-out '%{http_code}|%{content_type}' "$url" || true)"
            code="$(printf %s "$result" | cut -d '|' -f 1)"
            type="$(printf %s "$result" | cut -d '|' -f 2)"
            if [[ -z "$code" || "$result" != *"|"* ]]; then
              code="000"
              type="unknown"
            fi
            printf '%s: HTTP %s (%s)\n' "$label" "$code" "$type"
            printf '| %s | %s | %s |\n' "$label" "$code" "$type" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$code" != 2* ]]; then
              failed=1
            fi
          }

          probe "Ubuntu Touch 20.04 armhf rootfs" "$UBUNTU_ROOTFS_URL"
          probe "Halium 13 arm32 generic image" "$HALIUM_13_URL"
          probe "Google eos deviceinfo at b9ff8948" "$DEVICEINFO_URL"

          if (( failed )); then
            echo "::warning::One or more URLs could not be confirmed by HEAD. A HEAD failure may require a GET check; do not assume the file is gone."
            exit 1
          fi

      - name: Confirm scope
        shell: bash
        run: |
          echo "Preflight only: no device flashing, no kernel compilation, no multi-GB downloads."
